# GENERATED by scripts/prepare_scene.py from /home/rover/roverrobotic-ws/src/fast_calib/calib_data/rover_scene15
# 2208x1242, 24 images, 110 scans. Edit the crop box here, not the intrinsics.
# FAST-Calib parameters for the Rover Zero 3 (RoboSense Airy + ZED 2i left lens),
# with the SAME half-scale foam board as the Go2 (see qr_params_go2.yaml for how the
# board was measured). This is the BASE file: scripts/prepare_scene.py copies it per
# recording, filling in the intrinsics and paths from the bag, so a scene never runs
# with intrinsics from a different resolution than its frame.png.
#
# Board frame: origin at board centre, +x right, +y up, facing the board.
# ArUco layout facing the board:  top-left ID 1, top-right ID 2,
#                                 bottom-left ID 3, bottom-right ID 4.
#
# Result is T_cam_lidar (p_cam = Rcl * p_lidar + Pcl), camera = the ZED LEFT lens
# optical frame (camera_left_camera_frame_optical) -- the convention of Rcl/Pcl in
# src/fastlivo/config/rover_*_zed.yaml. It goes there and NOWHERE ELSE: the URDF feeds
# camera_guidelines, pointcloud_to_laserscan and theta_survey.
#
# Debug clouds are private topics: /fast_calib/filtered_cloud, /fast_calib/colored_cloud, ...
/**:
  ros__parameters:
    # --- Camera intrinsics: filled per scene by prepare_scene.py ------------------
    # From the bag's own camera_info. The ZED's rect image is undistorted, so k = p = 0.
    # Record at native resolution, not the 640x360 the stack publishes (fx 264): at
    # 1.2 m an 80 mm marker is ~18 px there against ~61 px on the Go2's D435i. The
    # extrinsic does not depend on resolution, so a 2K result drops straight into the
    # 640x360 FAST-LIVO2 config.
    fx: 1062.946044921875
    fy: 1062.946044921875
    cx: 1143.197998046875
    cy: 591.67919921875
    k1: 0.0
    k2: 0.0
    p1: 0.0
    p2: 0.0

    # --- Calibration target: identical to qr_params_go2.yaml ----------------------
    marker_size: 0.080              # FULL outer black-square side
    delta_width_qr_center: 0.2725   # HALF of the 545.0 mm marker centre spacing
    delta_height_qr_center: 0.2030  # HALF of the 406.0 mm marker centre spacing
    delta_width_circles: 0.26575    # FULL hole centre spacing, horizontal
    delta_height_circles: 0.21300   # FULL hole centre spacing, vertical
    circle_radius: 0.0810
    # The rotated bottom-left marker (id 3) was physically fixed before Go2 scene10.
    # If qr_detect.png shows its axes turned again, [0, 0, 3, 0] undoes 90 deg CW.
    marker_corner_shift: [0, 0, 0, 0]
    min_detected_markers: 4         # and no other DICT_6X6_250 marker may be in view

    # --- LiDAR hole detection ----------------------------------------------------
    # Template fit is the method validated on the Go2. The Airy has 96 rings over
    # 90 deg (~16 mm pitch at 1 m, vs the XT16's 35 mm), so upstream's boundary method
    # (use_template_fit: false) may work here too -- worth running as a cross-check.
    use_template_fit: true
    # Upstream value. Raise to 0.015-0.02 if plane_cloud drops a large share of the
    # board: the whole bag is accumulated, so range noise thickens the plane.
    plane_dist_threshold: 0.02

    # --- Distance filter, rslidar frame ------------------------------------------
    # FITTED for this scene by auto_box (2026-10-09), not provisional. Base-file note: The Airy is
    # pitched ~21 deg nose-down, so the box is in a tilted frame: an upright board
    # 1.2 m ahead with its centre ~0.2 m above the lidar sits near x 1.05, z 0.62,
    # and the floor enters a loose box from below. Raise the board on a stand.
    x_min: 0.692
    x_max: 1.142
    y_min: -0.400
    y_max: 0.253
    z_min: 0.361
    z_max: 0.985

    # --- Input / output: filled per scene by prepare_scene.py ---------------------
    lidar_topic: "/rslidar_points"
    bag_path: "/home/rover/roverrobotic-ws/src/fast_calib/calib_data/rover_scene15"
    image_path: "/home/rover/roverrobotic-ws/src/fast_calib/calib_data/rover_scene15/frame.png"
    output_path: "/home/rover/roverrobotic-ws/src/fast_calib/output_rover_scene15/"
    debug_frame: "fast_calib"
